# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: fedora44-ai-base image
run-name: ${{ inputs.monitor_id != '' && format('{0} [monitor:{1}:{2}]', github.workflow, inputs.monitor_id, inputs.monitor_final) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag. Empty uses YYYY.M.D."
        required: false
        default: ""
      core_tag:
        description: "fedora44-ai-core parent tag"
        required: false
        default: "latest"
      push_latest:
        description: "Also publish :latest"
        required: true
        type: boolean
        default: true
      cascade:
        description: "Build Safrano after Base succeeds"
        required: true
        type: boolean
        default: false
      monitor_id:
        description: "Optional event-monitor correlation id"
        required: false
        default: ""
        type: string
      monitor_final:
        description: "This run is the final monitored cascade stage"
        required: true
        default: true
        type: boolean

concurrency:
  group: fedora44-ai-base-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      CORE_IMAGE: ghcr.io/safrano9999/fedora44-ai-core
      BASE_IMAGE: ghcr.io/safrano9999/fedora44-ai-base
      DOCKER_BUILD_RECORD_UPLOAD: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: .github/scripts/free-runner-disk-space.sh

      - name: Resolve image references
        id: refs
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
          CORE_TAG: ${{ inputs.core_tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail
          version="$REQUESTED_TAG"
          [ -n "$version" ] || version="$(date +%Y.%-m.%-d)"
          core_ref="${CORE_IMAGE}:${CORE_TAG:-latest}"

          {
            echo "version=$version"
            echo "core_ref=$core_ref"
            echo "tags<<EOF"
            echo "${BASE_IMAGE}:${version}"
            [ "$PUSH_LATEST" != true ] || echo "${BASE_IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Fedora chain static checks
        run: fedora44-ai-core/tests/check-build-context.sh

      - name: Configure source authentication
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
        run: gh auth setup-git

      - name: Prepare Base build context
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
        run: fedora44-ai-base/prepare-build-context.sh --no-cache

      - name: Resolve Base build configuration
        id: base_build
        shell: bash
        run: |
          set -euo pipefail
          resolved=fedora44-ai-base/.resolved-build.env
          [ -s "$resolved" ] || {
            echo "Missing $resolved" >&2
            exit 1
          }
          {
            echo "build_args<<EOF"
            cat "$resolved"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          keep-state: false
          cleanup: true

      - name: Log in to private GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Base
        uses: docker/build-push-action@v6
        with:
          context: ./fedora44-ai-base
          file: ./fedora44-ai-base/Containerfile
          target: ai-base
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.refs.outputs.tags }}
          build-args: |
            AI_CORE_IMAGE=${{ steps.refs.outputs.core_ref }}
            ${{ steps.base_build.outputs.build_args }}

      - name: Reclaim space after Base build
        run: .github/scripts/prune-container-build-space.sh

      - name: Test published Base layer
        shell: bash
        run: |
          set -euo pipefail
          image="${BASE_IMAGE}:${{ steps.refs.outputs.version }}"
          docker pull "$image"
          docker run --rm --entrypoint bash "$image" -lc '
            set -euo pipefail
            grep -q "Fedora release 44" /etc/fedora-release
            test -x /usr/local/bin/openclaw-ephemeral.py
            test -x /usr/local/bin/openclaw-ephemeral-yolo
            test -x /usr/local/bin/hermes-ephemeral.py
            test -f /root/.openclaw/extensions/note/openclaw.plugin.json
            for project in WELCOME CODEANALYST CITADEL DIESDAS- NEXTCLOUD \
              safrano9999-paper; do
              test -d "/opt/safrano9999/$project"
            done
            for project in JUGO VikAI PV_D-A-CH KIWIX_BRIDGE \
              NAPOLEON_HILLS_AI_MASTERMIND_CLASSES \
              SOLANA_AIRGAPPED_DEBIAN_WORKFLOW \
              NaturalGrounding-Tiktok-Ying-Video-Manager \
              DAILYNEWS ZEROINBOX SPANKER KACHELMANN; do
              test ! -e "/opt/safrano9999/$project"
            done
            test -L /README/paper.pdf
            test "$(readlink /README/paper.pdf)" = \
              /opt/safrano9999/safrano9999-paper/paper.pdf
            test -s /README/paper.pdf
            systemctl is-enabled \
              fedora44-ai.service tailscaled.service tailscale-up.service \
              cockpit.service vditor-notes.service openclaw-config.service \
              openclaw.service hermes.service hermes-dashboard.service \
              codeanalyst.service citadel.service citadel-scan.service \
              safrano9999-welcome.service openclaw-safrano9999-base.service
          '
          test "$(
            docker image inspect \
              --format '{{ index .Config.Labels "io.safrano9999.parent" }}' \
              "$image"
          )" = fedora44-ai-core
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = root
          test "$(docker image inspect --format '{{json .Config.Cmd}}' "$image")" \
            = '["/sbin/init"]'
          docker buildx imagetools inspect "$image" >/dev/null

      - name: Trigger Safrano cascade
        if: inputs.cascade
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.refs.outputs.version }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run fedora44-ai-safrano9999-image.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f "image_tag=$IMAGE_TAG" \
            -f "base_tag=$IMAGE_TAG" \
            -f "push_latest=$PUSH_LATEST" \
            -f "monitor_id=${{ inputs.monitor_id }}" \
            -f "monitor_final=true"
