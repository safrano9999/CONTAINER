# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: fedora44-ai-core2 image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag. Empty uses YYYY.M.D."
        required: false
        default: ""
      core_tag:
        description: "fedora44-ai-core tag. Empty uses image_tag."
        required: false
        default: ""
      push_latest:
        description: "Also publish :latest"
        required: true
        type: boolean
        default: true

concurrency:
  group: fedora44-ai-core2-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/safrano9999/fedora44-ai-core2
      CORE_IMAGE: ghcr.io/safrano9999/fedora44-ai-core
      OPENCLAW_EPHEMERAL_IMAGE: docker.io/safrano9999/openclaw-ephemeral@sha256:8efeaf268d61e64fe3c4a4743384604718a8a728d7f0003e670897801f66ebce
      DOCKER_BUILD_RECORD_UPLOAD: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image references
        id: refs
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
          REQUESTED_CORE_TAG: ${{ inputs.core_tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail
          version="$REQUESTED_TAG"
          [ -n "$version" ] || version="$(date +%Y.%-m.%-d)"
          core_tag="$REQUESTED_CORE_TAG"
          [ -n "$core_tag" ] || core_tag="$version"
          {
            echo "version=$version"
            echo "core_ref=${CORE_IMAGE}:${core_tag}"
            echo "tags<<EOF"
            echo "${IMAGE}:${version}"
            [ "$PUSH_LATEST" != true ] || echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run static checks
        run: fedora44-ai-core2/tests/check-runtime.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          keep-state: false
          cleanup: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./fedora44-ai-core2
          file: ./fedora44-ai-core2/Containerfile
          target: ai-core2
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.refs.outputs.tags }}
          build-args: |
            AI_CORE_IMAGE=${{ steps.refs.outputs.core_ref }}
            OPENCLAW_EPHEMERAL_IMAGE=${{ env.OPENCLAW_EPHEMERAL_IMAGE }}
            OPENCLAW_VERSION=2026.7.1

      - name: Test published image
        env:
          IMAGE_TAG: ${{ steps.refs.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE}:${IMAGE_TAG}"
          docker pull "$image"
          docker run --rm --entrypoint bash "$image" -lc '
            set -euo pipefail
            test "$(jq -r .version "$(npm root -g)/openclaw/package.json")" = 2026.7.1
            test -x /usr/local/bin/openclaw-ephemeral.py
            test -x /usr/local/bin/openclaw-ephemeral-yolo
            test -x /usr/local/bin/hermes-ephemeral.py
            test -f /root/.openclaw/extensions/note/openclaw.plugin.json
            test -x /root/.openclaw/extensions/note/.venv/bin/python
            test -f /etc/systemd/system/openclaw-config.service
            test -f /etc/systemd/system/hermes.service
            test -f /etc/systemd/system/fedora44-ai.service
            test ! -e /opt/safrano9999
            python3 -c "import yaml; import openclaw_ephemeral"
            systemctl is-enabled fedora44-ai.service openclaw-config.service \
              openclaw.service hermes.service hermes-dashboard.service \
              tailscaled.service tailscale-up.service vditor-notes.service \
              cockpit.service
          '
          docker run --rm \
            --entrypoint /usr/local/bin/openclaw-ephemeral.py \
            "$image" configure
          docker buildx imagetools inspect "$image" >/dev/null

      - name: Verify private GHCR package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package_url="https://api.github.com/user/packages/container/fedora44-ai-core2"
          verified=false
          for _ in {1..20}; do
            if curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$package_url" \
              | jq -e '.name == "fedora44-ai-core2" and .visibility == "private"' \
                >/dev/null; then
              verified=true
              break
            fi
            sleep 3
          done
          [ "$verified" = true ]
