# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: fedora44-ai images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag. Empty uses YYYY.M.D."
        required: false
        default: ""
      build_scope:
        description: "Choose which image layer to build"
        required: true
        type: choice
        options:
          - safrano9999
          - base
          - all
        default: safrano9999
      core2_tag:
        description: "fedora44-ai-core2 parent tag"
        required: false
        default: "latest"
      push_latest:
        description: "Also publish :latest"
        required: true
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BASE_IMAGE: ghcr.io/safrano9999/fedora44-ai-base
      SAFRANO_IMAGE: ghcr.io/safrano9999/fedora44-ai-safrano9999
      CORE2_IMAGE: ghcr.io/safrano9999/fedora44-ai-core2
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout shared scripts
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          : "${GH_TOKEN:?GH_RELEASE_TOKEN is required}"
          gh repo clone safrano9999/SCRIPTS "$RUNNER_TEMP/SCRIPTS" -- --depth 1

      - name: Resolve image tags
        id: tags
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
          BUILD_SCOPE: ${{ inputs.build_scope }}
          PUSH_LATEST: ${{ inputs.push_latest }}
          CORE2_TAG: ${{ inputs.core2_tag }}
        run: |
          set -euo pipefail
          version="$REQUESTED_TAG"
          [ -n "$version" ] || version="$(date +%Y.%-m.%-d)"
          if [ "$BUILD_SCOPE" = all ] || [ "$BUILD_SCOPE" = base ]; then
            base_ref="${BASE_IMAGE}:${version}"
          else
            base_ref="${BASE_IMAGE}:latest"
          fi
          {
            echo "version=$version"
            echo "base_ref=$base_ref"
            echo "core2_ref=${CORE2_IMAGE}:${CORE2_TAG:-latest}"
            echo "base_tags<<EOF"
            echo "${BASE_IMAGE}:${version}"
            [ "$PUSH_LATEST" != true ] || echo "${BASE_IMAGE}:latest"
            echo "EOF"
            echo "safrano_tags<<EOF"
            echo "${SAFRANO_IMAGE}:${version}"
            [ "$PUSH_LATEST" != true ] || echo "${SAFRANO_IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Stage source repositories
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          DEV_SCRIPTS_DIR: ${{ runner.temp }}/SCRIPTS
        run: |
          gh auth setup-git
          cd fedora44-ai
          ./prepare-build-context.sh "$GITHUB_WORKSPACE/fedora44-ai"

      - name: Resolve image build configuration
        id: build
        shell: bash
        env:
          BUILD_SCOPE: ${{ inputs.build_scope }}
        run: |
          set -euo pipefail
          cd fedora44-ai
          [ -s .resolved-build.env ] || { echo "Missing .resolved-build.env" >&2; exit 1; }
          {
            echo "build_args<<EOF"
            cat .resolved-build.env
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          keep-state: false
          cleanup: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Base
        if: inputs.build_scope == 'all' || inputs.build_scope == 'base'
        uses: docker/build-push-action@v6
        with:
          context: ./fedora44-ai
          file: ./fedora44-ai/Containerfile
          target: ai-base
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.tags.outputs.base_tags }}
          build-args: |
            AI_CORE2_IMAGE=${{ steps.tags.outputs.core2_ref }}
            ${{ steps.build.outputs.build_args }}

      - name: Build and push Safrano layer
        if: inputs.build_scope != 'base'
        uses: docker/build-push-action@v6
        with:
          context: ./fedora44-ai
          file: ./fedora44-ai/Containerfile
          target: ai-safrano9999
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.tags.outputs.safrano_tags }}
          build-args: |
            AI_BASE_IMAGE=${{ steps.tags.outputs.base_ref }}
            ${{ steps.build.outputs.build_args }}

      - name: Test published Base layer
        if: inputs.build_scope == 'all' || inputs.build_scope == 'base'
        shell: bash
        run: |
          set -euo pipefail
          image="${BASE_IMAGE}:${{ steps.tags.outputs.version }}"
          docker pull "$image"
          docker run --rm --entrypoint bash "$image" -lc '
            set -euo pipefail
            test -x /usr/local/bin/openclaw-ephemeral.py
            test -x /usr/local/bin/hermes-ephemeral.py
            test -f /root/.openclaw/extensions/note/openclaw.plugin.json
            test ! -e /opt/safrano9999/NOTE
            for project in WELCOME CODEANALYST CITADEL DIESDAS- NEXTCLOUD; do
              test -d "/opt/safrano9999/$project"
            done
            systemctl is-enabled fedora44-ai.service openclaw-config.service \
              openclaw-safrano9999.service openclaw.service hermes.service \
              hermes-dashboard.service citadel.service codeanalyst.service
          '

      - name: Test published Safrano layer
        if: inputs.build_scope != 'base'
        shell: bash
        run: |
          set -euo pipefail
          image="${SAFRANO_IMAGE}:${{ steps.tags.outputs.version }}"
          docker pull "$image"
          docker run --rm --entrypoint bash "$image" -lc '
            set -euo pipefail
            test -x /usr/local/bin/openclaw-ephemeral.py
            test -x /usr/local/bin/hermes-ephemeral.py
            test -f /root/.openclaw/extensions/note/openclaw.plugin.json
            for project in JUGO VikAI PV_D-A-CH KIWIX_BRIDGE \
              NAPOLEON_HILLS_AI_MASTERMIND_CLASSES \
              SOLANA_AIRGAPPED_DEBIAN_WORKFLOW \
              NaturalGrounding-Tiktok-Ying-Video-Manager \
              DAILYNEWS ZEROINBOX SPANKER KACHELMANN; do
              test -d "/opt/safrano9999/$project"
            done
            systemctl is-enabled openclaw-config.service \
              openclaw-safrano9999.service openclaw.service hermes.service \
              jugo.service pvdach.service kiwix-bridge.service \
              napoleon.service naturalgrounding.service bip39.service \
              spanker-webui.service
          '
