# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: fedora44-ai-kachelmann image
run-name: ${{ inputs.monitor_id != '' && format('{0} [monitor:{1}:{2}]', github.workflow, inputs.monitor_id, inputs.monitor_final) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag. Empty uses YYYY.M.D."
        required: false
        default: ""
      base_tag:
        description: "fedora44-ai-base parent tag. Empty uses build.conf"
        required: false
        default: ""
      push_latest:
        description: "Also publish :latest"
        required: true
        type: boolean
        default: true
      monitor_id:
        description: "Optional event-monitor correlation id"
        required: false
        default: ""
        type: string
      monitor_final:
        description: "This run is the final monitored stage"
        required: true
        default: true
        type: boolean

concurrency:
  group: fedora44-ai-kachelmann-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: .github/scripts/free-runner-disk-space.sh

      - name: Resolve image references
        id: refs
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
          BASE_TAG: ${{ inputs.base_tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail
          set -a
          . fedora44-ai-kachelmann/build.conf
          set +a
          version="$REQUESTED_TAG"
          [ -n "$version" ] || version="$(date +%Y.%-m.%-d)"
          base_ref="$AI_BASE_IMAGE"
          [ -z "$BASE_TAG" ] || base_ref="${AI_BASE_IMAGE%:*}:$BASE_TAG"
          image="${FEDORA44_AI_KACHELMANN_IMAGE%:*}"

          {
            echo "version=$version"
            echo "base_ref=$base_ref"
            echo "image=$image"
            echo "tags<<EOF"
            echo "${image}:${version}"
            [ "$PUSH_LATEST" != true ] || echo "${image}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Configure source authentication
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
        run: gh auth setup-git

      - name: Prepare KACHELMANN build context
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
        run: fedora44-ai-kachelmann/prepare-build-context.sh --no-cache

      - name: Resolve KACHELMANN build configuration
        id: kachelmann_build
        shell: bash
        run: |
          set -euo pipefail
          resolved=fedora44-ai-kachelmann/.resolved-build.env
          [ -s "$resolved" ] || {
            echo "Missing $resolved" >&2
            exit 1
          }
          {
            echo "build_args<<EOF"
            cat "$resolved"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          keep-state: false
          cleanup: true

      - name: Log in to private GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push KACHELMANN layer
        uses: docker/build-push-action@v6
        with:
          context: ./fedora44-ai-kachelmann
          file: ./fedora44-ai-kachelmann/Containerfile
          target: ai-kachelmann
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.refs.outputs.tags }}
          build-args: |
            AI_BASE_IMAGE=${{ steps.refs.outputs.base_ref }}
            ${{ steps.kachelmann_build.outputs.build_args }}

      - name: Reclaim space after KACHELMANN build
        run: .github/scripts/prune-container-build-space.sh

      - name: Test published KACHELMANN layer
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.refs.outputs.image }}:${{ steps.refs.outputs.version }}"
          docker pull "$image"
          docker run --rm --entrypoint bash "$image" -lc '
            set -euo pipefail
            grep -q "Fedora release 44" /etc/fedora-release
            test -x /usr/local/bin/openclaw-ephemeral.py
            test -x /usr/local/bin/hermes-ephemeral.py
            test -d /opt/safrano9999/KACHELMANN
            test -f /opt/safrano9999/KACHELMANN/openclaw.plugin.json
            test "$(jq -r .id \
              /opt/safrano9999/KACHELMANN/openclaw.plugin.json)" = kachelmann
            test -f /opt/safrano9999/KACHELMANN/hermes/plugin.yaml
            test -x /usr/local/bin/kachelmann-hermes-enable
            test -f /etc/systemd/system/hermes.service.d/30-kachelmann.conf
            python3 -c "import fastapi, sqlalchemy, uvicorn"
            /usr/local/lib/hermes-agent/venv/bin/python -c "import sqlalchemy"
            for project in JUGO VikAI PV_D-A-CH KIWIX_BRIDGE \
              NAPOLEON_HILLS_AI_MASTERMIND_CLASSES \
              SOLANA_AIRGAPPED_DEBIAN_WORKFLOW \
              NaturalGrounding-Tiktok-Ying-Video-Manager \
              DAILYNEWS ZEROINBOX SPANKER; do
              test ! -e "/opt/safrano9999/$project"
            done
            systemctl is-enabled \
              fedora44-ai.service openclaw-config.service openclaw.service \
              hermes.service openclaw-safrano9999-base.service \
              openclaw-kachelmann.service kachelmann-webui.service \
              kachelmann-mcp.service
          '
          test "$(
            docker image inspect \
              --format '{{ index .Config.Labels "io.safrano9999.parent" }}' \
              "$image"
          )" = fedora44-ai-base
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = root
          test "$(docker image inspect --format '{{json .Config.Cmd}}' "$image")" \
            = '["/sbin/init"]'
          docker buildx imagetools inspect "$image" >/dev/null
