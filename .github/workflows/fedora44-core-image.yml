# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: fedora44-core image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag. Empty uses YYYY.M.D."
        required: false
        default: ""
      push_latest:
        description: "Also publish :latest"
        required: true
        type: boolean
        default: true

concurrency:
  group: fedora44-core-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/safrano9999/fedora44-core
      DOCKER_BUILD_RECORD_UPLOAD: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: tags
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail
          version="$REQUESTED_TAG"
          [ -n "$version" ] || version="$(date +%Y.%-m.%-d)"
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "${IMAGE}:${version}"
            [ "$PUSH_LATEST" != true ] || echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve immutable build inputs
        id: build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd fedora44-core
          ./prepare-build-context.sh
          set -a
          . ./build.conf
          set +a
          for name in CERTS HERMES_TAG HERMES_COMMIT HERMES_VERSION \
            ELECTRUM_VERSION LND_VERSION GETH_VERSION GETH_COMMIT \
            WEBHOOK_VERSION VDITOR_VERSION OPENCLAW_VERSION; do
            [ -n "${!name:-}" ] || {
              echo "Missing $name in build.conf" >&2
              exit 1
            }
          done
          {
            echo "build_args<<EOF"
            echo "CERTS=$CERTS"
            echo "HERMES_TAG=$HERMES_TAG"
            echo "HERMES_COMMIT=$HERMES_COMMIT"
            echo "HERMES_VERSION=$HERMES_VERSION"
            echo "ELECTRUM_VERSION=$ELECTRUM_VERSION"
            echo "LND_VERSION=$LND_VERSION"
            echo "GETH_VERSION=$GETH_VERSION"
            echo "GETH_COMMIT=$GETH_COMMIT"
            echo "WEBHOOK_VERSION=$WEBHOOK_VERSION"
            echo "VDITOR_VERSION=$VDITOR_VERSION"
            echo "OPENCLAW_VERSION=$OPENCLAW_VERSION"
            cat .resolved-build.env
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run static checks
        run: fedora44-core/tests/check-build-context.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          keep-state: false
          cleanup: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./fedora44-core
          file: ./fedora44-core/Containerfile
          target: ai-core
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ steps.build.outputs.build_args }}

      - name: Test published image
        env:
          IMAGE_TAG: ${{ steps.tags.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE}:${IMAGE_TAG}"
          docker pull "$image"
          docker run --rm --entrypoint bash "$image" -lc '
            set -euo pipefail
            grep -q "Fedora release 44" /etc/fedora-release
            for command in node npm python3 pip uv codex claude openclaw \
              hermes webhook cloudflared git gh jq tailscale cockpit-bridge \
              lnd lncli geth solana; do
              command -v "$command" >/dev/null
            done
            test "$(jq -r .version "$(npm root -g)/openclaw/package.json")" = 2026.7.1
            test -f /usr/local/lib/vditor/dist/index.min.js
            test -f /usr/local/lib/vditor-notes/app.py
            test -f /usr/local/share/bip39/index.html
            test -x /usr/local/bin/electrum
            test ! -e /opt/safrano9999
            test ! -e /usr/local/bin/openclaw-ephemeral.py
            test ! -e /root/.openclaw/extensions/note
          '
          docker buildx imagetools inspect "$image" >/dev/null

      - name: Verify private GHCR package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package_url="https://api.github.com/user/packages/container/fedora44-core"
          verified=false
          for _ in {1..20}; do
            if curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$package_url" \
              | jq -e '.name == "fedora44-core" and .visibility == "private"' \
                >/dev/null; then
              verified=true
              break
            fi
            sleep 3
          done
          [ "$verified" = true ]
