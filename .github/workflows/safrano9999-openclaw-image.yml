name: safrano9999-openclaw image

on:
  push:
    tags:
      - "20*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to publish. Empty uses YYYY.M.D."
        required: false
        default: ""
      plugin_release_tag:
        description: "Plugin release tag to stage before building."
        required: false
        default: "latest"
      push_latest:
        description: "Also publish docker.io/safrano9999/safrano9999-openclaw:latest."
        required: true
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: docker.io/safrano9999/safrano9999-openclaw
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            plugin_tag="${GITHUB_REF_NAME}"
          else
            version="${{ inputs.image_tag }}"
            if [ -z "$version" ]; then
              version="$(date +%Y.%-m.%-d)"
            fi
            plugin_tag="${{ inputs.plugin_release_tag }}"
          fi
          {
            echo "version=$version"
            echo "plugin_tag=$plugin_tag"
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${version}"
            if [ "${{ github.event_name == 'push' || inputs.push_latest }}" = "true" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Stage plugin release archives
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          OPENCLAW_PLUGIN_RELEASE_TAG: ${{ steps.tags.outputs.plugin_tag }}
        run: |
          cd safrano9999-openclaw
          ./setup.sh --no-config --no-build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./safrano9999-openclaw
          file: ./safrano9999-openclaw/Containerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
