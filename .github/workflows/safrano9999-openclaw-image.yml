# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: safrano9999 container images

on:
  push:
    tags:
      - "20*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to publish. Empty uses YYYY.M.D."
        required: false
        default: ""
      plugin_release_tag:
        description: "Plugin counter tag to stage. Empty/counter resolves each plugin independently."
        required: false
        default: "counter"
      push_latest:
        description: "Also publish the Docker images as :latest."
        required: true
        type: boolean
        default: true

jobs:
  build-and-push-safrano9999-openclaw:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: docker.io/safrano9999/safrano9999-openclaw
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            plugin_tag="counter"
          else
            version="${{ inputs.image_tag }}"
            if [ -z "$version" ]; then
              version="$(date +%Y.%-m.%-d)"
            fi
            plugin_tag="${{ inputs.plugin_release_tag }}"
          fi
          {
            echo "version=$version"
            echo "plugin_tag=$plugin_tag"
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${version}"
            if [ "${{ github.event_name == 'push' || inputs.push_latest }}" = "true" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Stage plugin release archives
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          OPENCLAW_PLUGIN_RELEASE_TAG: ${{ steps.tags.outputs.plugin_tag }}
        run: |
          cd safrano9999-openclaw
          CONFIG_CONTAINER_NAME=safrano9999-openclaw ./setup.sh --no-config --no-build

      - name: Resolve image build configuration
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cd safrano9999-openclaw
          build_conf="build.conf"
          [ -f "$build_conf" ] || build_conf="safrano9999-openclaw.build.conf_example"
          set -a
          . "./$build_conf"
          set +a
          : "${OPENCLAW_EPHEMERAL_IMAGE:?Missing OPENCLAW_EPHEMERAL_IMAGE}"
          {
            echo "openclaw_ephemeral_image=$OPENCLAW_EPHEMERAL_IMAGE"
            echo "source_key=$(sha256sum .safrano9999-source-tags.tsv | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          keep-state: false
          cleanup: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./safrano9999-openclaw
          file: ./safrano9999-openclaw/Containerfile
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            OPENCLAW_EPHEMERAL_IMAGE=${{ steps.build.outputs.openclaw_ephemeral_image }}
            SAFRANO9999_SOURCE_KEY=${{ steps.build.outputs.source_key }}

      - name: Test published runtime
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${{ steps.tags.outputs.version }}"
          docker run --rm --entrypoint bash "$image" -lc '
            set -euo pipefail
            test -x /usr/local/bin/openclaw-ephemeral.py
            test -x /usr/local/bin/safrano9999-openclaw-entrypoint
            test -x /usr/local/bin/safrano9999-openclaw-configure
            test -f /root/.openclaw/extensions/note/openclaw.plugin.json
            for plugin in dailynews nextcloud zeroinbox kachelmann citadel; do
              test -f "/root/.openclaw/extensions/$plugin/openclaw.plugin.json"
            done
            test "$(jq -r .version /app/package.json)" = 2026.7.1
          '

      - name: Verify private Docker Hub repository
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(
            jq -nc \
              --arg username "$DOCKERHUB_USERNAME" \
              --arg password "$DOCKERHUB_TOKEN" \
              '{username: $username, password: $password}'
          )"
          jwt="$(
            curl -fsSL \
              -H 'Content-Type: application/json' \
              -d "$payload" \
              https://hub.docker.com/v2/users/login/ \
              | jq -er .token
          )"
          curl -fsSL \
            -H "Authorization: JWT $jwt" \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/safrano9999-openclaw/" \
            | jq -e '.is_private == true' >/dev/null
