name: safrano9999 container images

on:
  push:
    tags:
      - "20*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to publish. Empty uses YYYY.M.D."
        required: false
        default: ""
      plugin_release_tag:
        description: "Plugin counter tag to stage. Empty/counter resolves each plugin independently."
        required: false
        default: "counter"
      push_latest:
        description: "Also publish the Docker images as :latest."
        required: true
        type: boolean
        default: true

jobs:
  build-and-push-safrano9999-openclaw:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: docker.io/safrano9999/safrano9999-openclaw
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            plugin_tag="counter"
          else
            version="${{ inputs.image_tag }}"
            if [ -z "$version" ]; then
              version="$(date +%Y.%-m.%-d)"
            fi
            plugin_tag="${{ inputs.plugin_release_tag }}"
          fi
          {
            echo "version=$version"
            echo "plugin_tag=$plugin_tag"
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${version}"
            if [ "${{ github.event_name == 'push' || inputs.push_latest }}" = "true" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Stage plugin release archives
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          OPENCLAW_PLUGIN_RELEASE_TAG: ${{ steps.tags.outputs.plugin_tag }}
        run: |
          cd safrano9999-openclaw
          ./setup.sh --no-config --no-build

      - name: Resolve image build configuration
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cd safrano9999-openclaw
          build_conf="build.conf"
          [ -f "$build_conf" ] || build_conf="safrano9999-openclaw.build.conf_example"
          set -a
          . "./$build_conf"
          set +a
          : "${OPENCLAW_IMAGE:?Missing OPENCLAW_IMAGE}"
          : "${OPENCLAW_CONFIG_DIR:?Missing OPENCLAW_CONFIG_DIR}"
          {
            echo "openclaw_image=$OPENCLAW_IMAGE"
            echo "openclaw_config_dir=$OPENCLAW_CONFIG_DIR"
            echo "source_key=$(sha256sum .safrano9999-source-tags.tsv | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./safrano9999-openclaw
          file: ./safrano9999-openclaw/Containerfile
          pull: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            OPENCLAW_IMAGE=${{ steps.build.outputs.openclaw_image }}
            OPENCLAW_CONFIG_DIR=${{ steps.build.outputs.openclaw_config_dir }}
            SAFRANO9999_SOURCE_KEY=${{ steps.build.outputs.source_key }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
