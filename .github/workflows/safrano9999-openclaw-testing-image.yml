# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: safrano9999-openclaw-testing build_image
run-name: safrano9999-openclaw-testing ${{ inputs.image_tag }}

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag in addition to latest
        required: true
        default: 2026.7.2-beta.5
        type: string
      plugin_release_tag:
        description: Plugin counter tag to stage
        required: true
        default: counter
        type: string
      push_latest:
        description: Also publish safrano9999-openclaw-testing:latest
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: safrano9999-openclaw-testing-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/safrano9999/safrano9999-openclaw-testing
  OPENCLAW_EPHEMERAL_IMAGE: ghcr.io/safrano9999/openclaw-ephemeral-testing:latest
  EXPECTED_OPENCLAW_VERSION: 2026.7.2-beta.5

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out container source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: .github/scripts/free-runner-disk-space.sh

      - name: Resolve GHCR tags
        id: tags
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            printf 'Invalid image tag: %s\n' "$IMAGE_TAG" >&2
            exit 1
          }
          {
            printf 'tags<<EOF\n'
            printf '%s:%s\n' "$IMAGE_NAME" "$IMAGE_TAG"
            if [[ "$PUSH_LATEST" == "true" ]]; then
              printf '%s:latest\n' "$IMAGE_NAME"
            fi
            printf 'EOF\n'
          } >>"$GITHUB_OUTPUT"

      - name: Stage plugin release archives
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          OPENCLAW_PLUGIN_RELEASE_TAG: ${{ inputs.plugin_release_tag }}
        run: |
          cd safrano9999-openclaw
          CONFIG_CONTAINER_NAME=safrano9999-openclaw ./setup.sh --no-config --no-build

      - name: Resolve plugin source key
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          cd safrano9999-openclaw
          test -s .safrano9999-source-tags.tsv
          printf 'source_key=%s\n' \
            "$(sha256sum .safrano9999-source-tags.tsv | cut -d' ' -f1)" \
            >>"$GITHUB_OUTPUT"

      - name: Validate inherited plugin image contract
        shell: bash
        run: |
          set -Eeuo pipefail
          file=safrano9999-openclaw/Containerfile
          grep -F -- 'ARG OPENCLAW_EPHEMERAL_IMAGE=' "$file" >/dev/null
          grep -F -- 'FROM ${OPENCLAW_EPHEMERAL_IMAGE}' "$file" >/dev/null
          grep -F -- 'safrano9999_OC_plugins CITADEL' "$file" >/dev/null
          grep -F -- 'DAILYNEWS NEXTCLOUD ZEROINBOX KACHELMANN' "$file" >/dev/null
          test -x \
            safrano9999-openclaw/image/runtime.d/rootfs/usr/local/share/openclaw-ephemeral/runtime.d/post-config.d/10-register-plugins.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and publish plugin-complete testing image
        uses: docker/build-push-action@v6
        with:
          context: ./safrano9999-openclaw
          file: ./safrano9999-openclaw/Containerfile
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            OPENCLAW_EPHEMERAL_IMAGE=${{ env.OPENCLAW_EPHEMERAL_IMAGE }}
            SAFRANO9999_SOURCE_KEY=${{ steps.build.outputs.source_key }}
          labels: |
            org.opencontainers.image.title=safrano9999-openclaw-testing
            org.opencontainers.image.description=Testing OpenClaw gateway with safrano9999 plugins and slash commands.
            org.opencontainers.image.source=https://github.com/safrano9999/CONTAINER
            io.safrano9999.openclaw-ephemeral-testing.image=${{ env.OPENCLAW_EPHEMERAL_IMAGE }}

      - name: Reclaim container build space
        run: .github/scripts/prune-container-build-space.sh

      - name: Verify published plugins and slash-command runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          image="${IMAGE_NAME}:${{ inputs.image_tag }}"
          docker pull "$image"
          test "$(
            docker run --rm --entrypoint node "$image" \
              -p "require('/app/package.json').version"
          )" = "$EXPECTED_OPENCLAW_VERSION"
          docker run --rm --entrypoint bash "$image" -lc '
            set -Eeuo pipefail
            test -x /usr/local/bin/openclaw-ephemeral.py
            test -x /usr/local/bin/safrano9999-openclaw-configure
            for plugin in note dailynews nextcloud zeroinbox kachelmann citadel; do
              test -f "/root/.openclaw/extensions/$plugin/openclaw.plugin.json"
            done
            test -x /usr/local/share/openclaw-ephemeral/runtime.d/post-config.d/10-register-plugins.sh
          '

          container=openclaw-testing-smoke
          trap 'docker logs "$container" || true; docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" \
            -e OPENCLAW_GATEWAY_TOKEN=testing-smoke-token \
            -e SAFRANO9999_FULLRUN_ON_START=0 \
            "$image"
          ready=false
          for _ in $(seq 1 90); do
            if docker exec "$container" \
              curl -fsS http://127.0.0.1:18789/healthz >/dev/null 2>&1; then
              ready=true
              break
            fi
            test "$(docker inspect -f '{{.State.Running}}' "$container")" = true
            sleep 1
          done
          test "$ready" = true
          docker logs "$container" 2>&1 \
            | grep -F '[entrypoint] registering safrano9999 OpenClaw plugins' >/dev/null
          docker exec "$container" node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("/root/.openclaw/openclaw.json", "utf8"));
            for (const id of ["note", "dailynews", "nextcloud", "zeroinbox", "kachelmann", "citadel"]) {
              if (config.plugins?.entries?.[id]?.enabled !== true) process.exit(1);
            }
          '
          docker exec "$container" grep -F 'name: "mails"' \
            /root/.openclaw/extensions/zeroinbox/index.js >/dev/null
          docker exec "$container" grep -F 'name: "routines"' \
            /root/.openclaw/extensions/kachelmann/index.js >/dev/null
