name: Seed fedora44-ai registry secrets

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Copy registry credentials
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_USERNAME" | gh secret set DOCKERHUB_USERNAME -R safrano9999/fedora44-ai
          printf '%s' "$DOCKERHUB_TOKEN" | gh secret set DOCKERHUB_TOKEN -R safrano9999/fedora44-ai

      - name: Ensure Docker Hub repository exists
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          login_payload="$(jq -nc --arg username "$DOCKERHUB_USERNAME" --arg password "$DOCKERHUB_TOKEN" '{username:$username,password:$password}')"
          jwt="$(curl -fsS -H 'Content-Type: application/json' -d "$login_payload" https://hub.docker.com/v2/users/login/ | jq -er .token)"
          status="$(curl -sS -o /tmp/repository.json -w '%{http_code}' -H "Authorization: JWT $jwt" "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/fedora44-ai/")"
          if [ "$status" = "404" ]; then
            create_payload="$(jq -nc '{name:"fedora44-ai",description:"Fedora 44 systemd AI container",is_private:false}')"
            curl -fsS -H "Authorization: JWT $jwt" -H 'Content-Type: application/json' -d "$create_payload" "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/" >/dev/null
          elif [ "$status" != "200" ]; then
            cat /tmp/repository.json >&2
            exit 1
          fi
